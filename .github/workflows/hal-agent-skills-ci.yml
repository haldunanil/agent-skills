name: Hal Agent Skills CI

on:
  push:
    branches: [main]
    paths:
      - "skills/**"
      - "packages/hal-agent-skills/**"
  pull_request:
    branches: [main]
    paths:
      - "skills/**"
      - "packages/hal-agent-skills/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/hal-agent-skills
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: packages/hal-agent-skills/package-lock.json
      - run: npm ci
      # Skill script checks run from the repo root (stdlib-only node:test; no deps needed).
      - name: Check viewer.js syntax
        working-directory: ${{ github.workspace }}
        run: node --check skills/pr-walkthrough/assets/viewer.js
      - name: Run pr-walkthrough tests
        working-directory: ${{ github.workspace }}
        run: node --test skills/pr-walkthrough/scripts/build-walkthrough.test.mjs
      - run: npm run validate
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: skill-zips
          path: skills/*.zip
          if-no-files-found: error
