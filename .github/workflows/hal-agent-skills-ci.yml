name: Hal Agent Skills CI

on:
  push:
    branches: [main]
    paths:
      - "skills/**"
      - "packages/hal-agent-skills/**"
  pull_request:
    branches: [main]
    paths:
      - "skills/**"
      - "packages/hal-agent-skills/**"

jobs:
  # Skill script checks (stdlib-only node:test; no npm install needed). Runs in
  # parallel with `validate` and shows as its own check in the PR checks section.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check browser asset syntax
        run: |
          node --check skills/pr-walkthrough/assets/viewer.js
          node --check skills/pr-walkthrough/assets/comments.js
      - name: Run pr-walkthrough tests
        run: node --test skills/pr-walkthrough/scripts/build-walkthrough.test.mjs
      - name: Run post-pr-review tests
        run: node --test skills/post-pr-review/scripts/post-review.test.mjs

  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/hal-agent-skills
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: packages/hal-agent-skills/package-lock.json
      - run: npm ci
      - run: npm run validate
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: skill-zips
          path: skills/*.zip
          if-no-files-found: error
